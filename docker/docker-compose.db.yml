services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant_db
    restart: always
    volumes:
      - /data/db:/qdrant/storage:z
    networks:
      - rag_internal
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  rag_internal:
    internal: true